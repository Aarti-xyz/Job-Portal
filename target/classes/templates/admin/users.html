<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Manage Users</title>
<style>

body{
font-family:Arial;
background:#f4f4f4;
margin:0;
}

h1{
background:#0d6efd;
color:white;
text-align:center;
padding:20px;
}

table{
width:90%;
margin:30px auto;
border-collapse:collapse;
background:white;
box-shadow:0 0 10px gray;
}

th{
background:#0d6efd;
color:white;
padding:12px;
}

td{
border:1px solid #ddd;
padding:12px;
text-align:center;
}

.delete{
background:red;
color:white;
padding:8px 15px;
text-decoration:none;
border-radius:5px;
}

.back{
display:block;
width:180px;
margin:20px auto;
text-align:center;
background:#0d6efd;
color:white;
padding:10px;
text-decoration:none;
border-radius:5px;
}
</style>
</head>
<body>
<h1>Manage Users</h1>
<table>

<tr>
<th>ID</th>
<th>Name</th>
<th>Email</th>
<th>Mobile</th>
<th>Address</th>
<th>Action</th>
</tr>

<tr th:each="user : ${users}">

<td th:text="${user.id}"></td>
<td th:text="${user.name}"></td>
<td th:text="${user.email}"></td>
<td th:text="${user.mobile}"></td>
<td th:text="${user.address}"></td>

<td>

<a class="delete"
th:href="@{/admin/delete-user/{id}(id=${user.id})}"
onclick="return confirm('Are you sure you want to delete this user?')">
            Delete
</a>
</td>

</tr>
</table>

<a href="/admin/dashboard" class="back">
Back to Dashboard
</a>

</body>
</html>
