<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Manage Jobs</title>
<style>
body{
font-family:Arial;
background:#f4f4f4;
margin:0;
}

h1{
background:#0d6efd;
color:white;
text-align:center;
padding:20px;
}

table{
width:95%;
margin:30px auto;
border-collapse:collapse;
background:white;
}

th{
background:#0d6efd;
color:white;
padding:12px;
}

td{
border:1px solid #ddd;
padding:12px;
text-align:center;
}

.delete{
background:red;
color:white;
padding:8px 15px;
text-decoration:none;
border-radius:5px;
}

.back{
display:block;
width:180px;
margin:20px auto;
text-align:center;
background:#0d6efd;
color:white;
padding:10px;
text-decoration:none;
border-radius:5px;
}
</style>
</head>
<body>
<h1>Manage Jobs</h1>
<table>
<tr>
<th>ID</th>
<th>Title</th>
<th>Company</th>
<th>Location</th>
<th>Salary</th>
<th>Action</th>
</tr>
<tr th:each="job : ${jobs}">
<td th:text="${job.id}"></td>
<td th:text="${job.title}"></td>
<td th:text="${job.company}"></td>
<td th:text="${job.location}"></td>
<td th:text="${job.salary}"></td>
<td>
<a class="delete"
th:href="@{/admin/delete-job/{id}(id=${job.id})}"
onclick="return confirm('Delete this job?')">
            Delete
</a>
</td>
</tr>
</table>
<a href="/admin/dashboard" class="back">
Back to Dashboard
</a>
</body>
</html>
