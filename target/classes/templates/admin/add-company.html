<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Add Company</title>

<style>

body{
font-family:Arial;
background:#f4f4f4;
}

.container{
width:500px;
margin:30px auto;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0px 0px 10px gray;
}

h2{
text-align:center;
color:#0d6efd;
}

input,textarea{
width:100%;
padding:10px;
margin:10px 0;
}

button{
width:100%;
padding:12px;
background:#0d6efd;
color:white;
border:none;
cursor:pointer;
border-radius:5px;
}

a{
text-decoration:none;
display:block;
text-align:center;
margin-top:15px;
}
</style>
</head>

<body>

<div class="container">

<h2>Add Company</h2>

<form th:action="@{/admin/save-company}" method="post">

<input type="text" name="companyName"placeholder="Company Name"required>

<input type="email"name="email"placeholder="Email"required>

<input type="text"name="phone"placeholder="Phone"required>

<input type="text"name="website"placeholder="Website">

<input type="text"name="address"placeholder="Address">

<textareaname="description"placeholder="Description">
</textarea>

<button type="submit">

Save Company

</button>

</form>

<a href="/admin/companies">

Back

</a>

</div>

</body>

</html>
