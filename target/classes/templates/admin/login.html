<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Admin Login</title>
<style>
body{
font-family:Arial;
background-color:white;
}

.container{
width:350px;
margin:80px auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 0 10px gray;
}

h2{
text-align:center;
}

input{
width:100%;
padding:10px;
margin:10px 0;
}

button{
width:100%;
padding:10px;
background:peach;
color:white;
border:none;
cursor:pointer;
}
</style>
</head>
<body>
<div class="container">
<h2>Admin Login</h2>

<form action="/admin/login" method="post">

<input type="email" name="email" placeholder="Enter Email" required>

<input type="password" name="password" placeholder="Enter Password" required>

<button type="submit"> Login </button>

</form>
</div>
</body>
</html>
