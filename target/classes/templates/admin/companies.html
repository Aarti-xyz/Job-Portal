<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<meta charset="UTF-8">

<title>Manage Companies</title>

<style>

body{
font-family:Arial;
background:#f4f4f4;
margin:0;
}

h1{
background:#0d6efd;
color:white;
text-align:center;
padding:20px;
margin:0;
}

.top{
text-align:center;
margin:20px;
}

.add-btn{
background:green;
color:white;
text-decoration:none;
padding:12px 25px;
border-radius:5px;
font-size:16px;
}

.add-btn:hover{
background:darkgreen;
}

table{
width:98%;
margin:auto;
border-collapse:collapse;
background:white;
box-shadow:0px 0px 10px gray;
}

th{
background:#0d6efd;
color:white;
padding:12px;
}

td{
border:1px solid #ddd;
padding:12px;
text-align:center;
}

.action-buttons{
display:flex;
justify-content:center;
align-items:center;
gap:10px;
}

.btn{
display:inline-block;
text-decoration:none;
color:white;
padding:8px 18px;
border-radius:5px;
font-size:14px;
min-width:70px;
text-align:center;
}

.edit{
background:orange;
}

.delete{
background:red;
}

.edit:hover{
background:#d48806;
}

.delete:hover{
background:#c82333;
}

.back{
display:block;
width:220px;
margin:30px auto;
text-align:center;
text-decoration:none;
background:#0d6efd;
color:white;
padding:12px;
border-radius:5px;
font-size:16px;
}

.back:hover{
background:#084298;
}

</style>

</head>

<body>

<h1>Manage Companies</h1>

<div class="top">

<a href="/admin/add-company" class="add-btn">
Add New Company
</a>

</div>

<table>

<tr>

<th>ID</th>

<th>Company Name</th>

<th>Email</th>

<th>Phone</th>

<th>Website</th>

<th>Address</th>

<th>Description</th>

<th style="width:180px;">Action</th>

</tr>

<tr th:each="company : ${companies}">

<td th:text="${company.id}"></td>

<td th:text="${company.companyName}"></td>

<td th:text="${company.email}"></td>

<td th:text="${company.phone}"></td>

<td th:text="${company.website}"></td>

<td th:text="${company.address}"></td>

<td th:text="${company.description}"></td>

<td>

<div class="action-buttons">

<a th:href="@{/admin/edit-company/{id}(id=${company.id})}"
class="btn edit">
Edit
</a>

<a th:href="@{/admin/delete-company/{id}(id=${company.id})}"
class="btn delete"
onclick="return confirm('Are you sure you want to delete this company?')">
Delete
</a>

</div>

</td>

</tr>

</table>

<a href="/admin/dashboard" class="back">
Back to Dashboard
</a>

</body>

</html>
