<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>Edit Job</title>

<style>

body{
font-family:Arial;
background:#f4f4f4;
}

.container{
width:500px;
margin:40px auto;
background:white;
padding:20px;
border-radius:10px;
box-shadow:0 0 10px gray;
}

input,textarea{
width:100%;
padding:10px;
margin:10px 0;
}

button{
padding:10px 20px;
background:#0d6efd;
color:white;
border:none;
cursor:pointer;
}

</style>

</head>
<body>

<div class="container">

<h2>Edit Job</h2>

<form th:action="@{/update-job}" method="post">

<input type="hidden" name="id" th:value="${job.id}">

<label>Job Title</label>
<input type="text" name="title" th:value="${job.title}" required>

<label>Company</label>
<input type="text" name="company" th:value="${job.company}" required>

<label>Location</label>
<input type="text" name="location" th:value="${job.location}" required>

<label>Salary</label>
<input type="text" name="salary" th:value="${job.salary}" required>

<label>Description</label>

<textarea name="description" rows="5"
th:text="${job.description}">
</textarea>

<br>

<button type="submit">Update Job</button>

</form>

</div>

</body>
</html>
