<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>

<title>Edit Profile</title>

<style>

body{
font-family:Arial;
background:#f4f4f4;
}

.container{
width:500px;
margin:40px auto;
background:white;
padding:30px;
border-radius:10px;
box-shadow:0 0 10px gray;
}

h2{
text-align:center;
color:#0d6efd;
}

input{
width:100%;
padding:10px;
margin:10px 0;
}

button{
width:100%;
padding:12px;
background:#0d6efd;
color:white;
border:none;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#084298;
}

</style>

</head>

<body>

<div class="container">

<h2>Edit Profile</h2>

<form action="/update-profile" method="post">

<input type="text"name="name"th:value="${user.name}"placeholder="Name">

<input type="email"name="email"th:value="${user.email}"placeholder="Email">

<input type="text"name="mobile"th:value="${user.mobile}"placeholder="Mobile">

<input type="text"name="address"th:value="${user.address}"placeholder="Address">

<button type="submit">Update Profile</button>

</form>

</div>

</body>

</html>
