<!DOCTYPE html>
<html>
<head>
<title>Upload Resume</title>

<style>
body{
font-family:Arial;
background:#f4f4f4;
}

.container{
width:400px;
margin:50px auto;
background:white;
padding:20px;
border-radius:10px;
text-align:center;
}

input{
margin:15px;
}

button{
padding:10px 20px;
background:#0d6efd;
color:white;
border:none;
cursor:pointer;
}
</style>

</head>

<body>

<div class="container">

<h2>Upload Resume</h2>

<form action="/resume" method="post" enctype="multipart/form-data">

<input type="file" name="resume" required>

<br>

<button type="submit">Upload</button>

</form>

</div>

</body>
</html>
