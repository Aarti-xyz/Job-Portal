<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<title>My Profile</title>

<style>

body{
font-family:Arial;
background:#f4f4f4;
}

.container{
width:500px;
margin:40px auto;
background:white;
padding:25px;
border-radius:10px;
box-shadow:0 0 10px gray;
}

h2{
text-align:center;
color:#0d6efd;
}

table{
width:100%;
border-collapse:collapse;
margin-top:20px;
}

td{
padding:10px;
border:1px solid #ddd;
}

.btn{
display:inline-block;
padding:10px 18px;
background:#0d6efd;
color:white;
text-decoration:none;
border-radius:5px;
margin-top:20px;
margin-right:10px;
}

.btn:hover{
background:#084298;
}

</style>

</head>

<body>

<div class="container">

<h2>My Profile</h2>

<table>

<tr>
<td><b>Name</b></td>
<td th:text="${user.name}"></td>
</tr>

<tr>
<td><b>Email</b></td>
<td th:text="${user.email}"></td>
</tr>

<tr>
<td><b>Mobile</b></td>
<td th:text="${user.mobile}"></td>
</tr>

<tr>
<td><b>Address</b></td>
<td th:text="${user.address}"></td>
</tr>

</table>

<br>

<a href="/edit-profile" class="btn">Edit Profile</a>

<a href="/user/dashboard" class="btn">Back</a>

</div>

</body>
</html>
