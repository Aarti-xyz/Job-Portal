<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<head>

<title>Reports Dashboard</title>

<style>

body{
font-family:Arial;
background:#f4f4f4;
margin:0;
}

h1{
background:#0d6efd;
color:white;
text-align:center;
padding:20px;
margin:0;
}

.container{
width:90%;
margin:30px auto;
display:grid;
grid-template-columns:repeat(2,1fr);
gap:20px;
}

.card{
background:white;
padding:30px;
border-radius:10px;
text-align:center;
box-shadow:0px 0px 10px gray;
}

.card h2{
color:#0d6efd;
}

.card p{
font-size:35px;
font-weight:bold;
}

.back{
display:block;
width:220px;
margin:30px auto;
text-align:center;
text-decoration:none;
background:#0d6efd;
color:white;
padding:12px;
border-radius:5px;
}

</style>

</head>

<body>

<h1>Reports Dashboard</h1>

<div class="container">

<div class="card">
<h2>Total Users</h2>
<p th:text="${totalUsers}"></p>
</div>

<div class="card">
<h2>Total Jobs</h2>
<p th:text="${totalJobs}"></p>
</div>

<div class="card">
<h2>Total Companies</h2>
<p th:text="${totalCompanies}"></p>
</div>

<div class="card">
<h2>Total Applications</h2>
<p th:text="${totalApplications}"></p>
</div>

<div class="card">
<h2>Accepted</h2>
<p style="color:green;" th:text="${accepted}"></p>
</div>

<div class="card">
<h2>Rejected</h2>
<p style="color:red;" th:text="${rejected}"></p>
</div>

<div class="card">
<h2>Pending</h2>
<p style="color:orange;" th:text="${pending}"></p>
</div>

</div>

<a href="/admin/dashboard" class="back">
Back to Dashboard
</a>

</body>
</html>
